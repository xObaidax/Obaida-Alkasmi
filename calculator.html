<!-- calculator.html -->
<!DOCTYPE html> <!-- نوع الملف -->
<html lang="fr"> <!-- لغة -->
  <head> <!-- رأس -->
    <meta charset="UTF-8" /> <!-- ترميز -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- هاتف -->
    <title>Calculatrice</title> <!-- عنوان -->
    <link rel="stylesheet" href="style.css" /> <!-- CSS -->
  </head> <!-- نهاية -->

  <body> <!-- جسم -->

    <div class="calc-page"> <!-- صفحة الآلة -->

      <div class="calc-shell"> <!-- جسم زجاجي -->

        <div class="calc-top"> <!-- أعلى -->
          <a class="back-link" href="index.html">Retour</a> <!-- رجوع -->
          <div class="calc-title">Calculatrice</div> <!-- عنوان -->
        </div> <!-- نهاية -->

        <div class="calc-screen"> <!-- شاشة -->
          <input id="calcDisplay" class="calc-display" type="text" value="0" readonly /> <!-- شاشة -->
          <div id="calcMini" class="calc-mini">0</div> <!-- سطر صغير -->
        </div> <!-- نهاية -->

        <div class="calc-grid"> <!-- شبكة -->
          <button class="calc-btn gray" data-v="AC">AC</button> <!-- مسح -->
          <button class="calc-btn gray" data-v="DEL">DEL</button> <!-- حذف -->
          <button class="calc-btn gray" data-v="%">%</button> <!-- نسبة -->
          <button class="calc-btn op" data-v="/">÷</button> <!-- قسمة -->

          <button class="calc-btn" data-v="7">7</button>
          <button class="calc-btn" data-v="8">8</button>
          <button class="calc-btn" data-v="9">9</button>
          <button class="calc-btn op" data-v="*">×</button>

          <button class="calc-btn" data-v="4">4</button>
          <button class="calc-btn" data-v="5">5</button>
          <button class="calc-btn" data-v="6">6</button>
          <button class="calc-btn op" data-v="-">−</button>

          <button class="calc-btn" data-v="1">1</button>
          <button class="calc-btn" data-v="2">2</button>
          <button class="calc-btn" data-v="3">3</button>
          <button class="calc-btn op" data-v="+">+</button>

          <button class="calc-btn gray" data-v="+/-">+/-</button>
          <button class="calc-btn zero" data-v="0">0</button>
          <button class="calc-btn" data-v=".">.</button>
          <button class="calc-btn op" data-v="=">=</button>
        </div> <!-- نهاية الشبكة -->

        <div class="calc-tip" id="calcTip">Prêt</div> <!-- حالة -->

      </div> <!-- نهاية shell -->
    </div> <!-- نهاية page -->

    <script src="calculator.js"></script> <!-- JS -->
  </body> <!-- نهاية -->
</html> <!-- نهاية -->
